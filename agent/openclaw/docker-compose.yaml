services:
  openclaw-gateway:
    image: ghcr.io/openclaw/openclaw:main
    environment:
      HOME: /home/node
      TERM: xterm-256color
    volumes:
      - ./data:/home/node/.openclaw
    ports:
      - "2026:18789"
    init: true
    restart: unless-stopped
    command: node dist/index.js gateway --bind lan --port 18789

  openclaw-cli:
    image: ghcr.io/openclaw/openclaw:main
    environment:
      HOME: /home/node
      TERM: xterm-256color
      BROWSER: echo
    volumes:
      - ./data:/home/node/.openclaw
    network_mode: service:openclaw-gateway
    stdin_open: true
    tty: true
    init: true
    entrypoint: [ "node", "dist/index.js" ]
